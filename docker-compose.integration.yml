services:
  frontend:
    environment:
      AUTH_COOKIE_SECURE: "false"
  api:
    environment:
      AWS_STORAGE_BUCKET_NAME: studyease-private
      AWS_ACCESS_KEY_ID: localstudyease
      AWS_SECRET_ACCESS_KEY: localstudyeasechange
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      AWS_QUERYSTRING_EXPIRE: "5"
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      HEALTH_REQUIRE_REDIS: "true"
      CACHE_URL: redis://redis:6379/2
    depends_on:
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
  worker:
    environment:
      AWS_STORAGE_BUCKET_NAME: studyease-private
      AWS_ACCESS_KEY_ID: localstudyease
      AWS_SECRET_ACCESS_KEY: localstudyeasechange
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ADDRESSING_STYLE: path
      AWS_QUERYSTRING_EXPIRE: "5"
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: clamav
      CACHE_URL: redis://redis:6379/2
    depends_on:
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
