components:
  schemas:
    AdministrativeHealth:
      type: object
      properties:
        status:
          type: string
        providers:
          type: object
          additionalProperties: {}
        vector:
          type: object
          additionalProperties: {}
        workers:
          type: object
          additionalProperties: {}
      required:
      - providers
      - status
      - vector
      - workers
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - metadata
      - request_id
      - target_id
      - target_type
    Citation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        chunk:
          type: integer
        document_title:
          type: string
          readOnly: true
        page:
          type: integer
          readOnly: true
        quote:
          type: string
        score:
          type: number
          format: double
          maximum: 1
          minimum: 0
          nullable: true
      required:
      - chunk
      - document_title
      - id
      - page
    Concept:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        course:
          type: integer
          nullable: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 255
        description:
          type: string
        lessons:
          type: array
          items:
            type: integer
        prerequisites:
          type: array
          items:
            type: integer
      required:
      - created_by
      - id
      - name
      - slug
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        course:
          type: integer
          nullable: true
        lesson:
          type: integer
          nullable: true
        messages:
          type: array
          items: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - archived_at
      - created_at
      - id
      - messages
      - owner
      - updated_at
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 255
        description:
          type: string
        instructor:
          type: integer
          readOnly: true
          nullable: true
        instructor_name:
          type: string
          readOnly: true
        is_published:
          type: boolean
        is_archived:
          type: boolean
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        archived_by:
          type: integer
          readOnly: true
          nullable: true
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
          readOnly: true
      required:
      - archived_at
      - archived_by
      - created_at
      - id
      - instructor
      - instructor_name
      - is_archived
      - modules
      - slug
      - title
      - updated_at
    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        course:
          type: integer
          nullable: true
        lesson:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
          nullable: true
          writeOnly: true
        source_url:
          writeOnly: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        status:
          allOf:
          - $ref: '#/components/schemas/DocumentStatusEnum'
          readOnly: true
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        processing_error:
          type: string
          readOnly: true
        scan_status:
          allOf:
          - $ref: '#/components/schemas/ScanStatusEnum'
          readOnly: true
        scan_provider:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        scan_result:
          type: string
          readOnly: true
        quarantine_reason:
          type: string
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        file_size:
          type: integer
          readOnly: true
        checksum:
          type: string
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        processing_started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        chunk_count:
          type: integer
          readOnly: true
        embedding_provider:
          type: string
          readOnly: true
        embedding_model:
          type: string
          readOnly: true
        embedding_dimensions:
          type: integer
          readOnly: true
        processing_version:
          type: integer
          readOnly: true
        topics: {}
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
