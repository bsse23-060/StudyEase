pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  upstream frontend { server frontend:3000; }
  upstream api { server api:8000; }
  server {
    listen 8080;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /health/ { proxy_pass http://api; proxy_set_header X-Request-ID $request_id; }
    location /static/ { proxy_pass http://api; expires 7d; }
    location /api/auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://frontend; include /etc/nginx/proxy_params; }
    location /api/v1/ { proxy_pass http://api; include /etc/nginx/proxy_params; proxy_read_timeout 120s; proxy_send_timeout 120s; }
    location /api/schema/ { proxy_pass http://api; include /etc/nginx/proxy_params; }
    location /api/docs/ { proxy_pass http://api; include /etc/nginx/proxy_params; }
    location /api/ { proxy_pass http://frontend; include /etc/nginx/proxy_params; proxy_read_timeout 120s; proxy_send_timeout 120s; }
    location / { proxy_pass http://frontend; include /etc/nginx/proxy_params; }
  }
}
