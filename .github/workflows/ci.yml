name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run --source=accounts,courses,learning,study_tools,config manage.py test
      - run: coverage report --fail-under=92
      - run: python manage.py spectacular --file schema.ci.yml --validate
      - run: diff -u schema.yml schema.ci.yml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run api:types && git diff --exit-code src/types/api.generated.ts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run format && npm run test:coverage && npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_DB: studyease, POSTGRES_USER: studyease, POSTGRES_PASSWORD: studyease }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyease" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://studyease:studyease@127.0.0.1:5432/studyease
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      RAG_VECTOR_BACKEND: pgvector
      RAG_VECTOR_DIMENSIONS: 1536
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python manage.py migrate --noinput && python manage.py check
      - run: python manage.py test study_tools
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose --profile s3 --profile scanner -f docker-compose.yml -f docker-compose.integration.yml up --build --wait
      - run: pwsh scripts/smoke_test.ps1
      - run: docker compose exec -T api python manage.py seed_demo
      - run: pwsh scripts/api_walkthrough.ps1
      - run: pwsh scripts/rag_walkthrough.ps1
      - run: npm run test:e2e
        working-directory: frontend
        env: { PLAYWRIGHT_EXTERNAL_SERVER: "1", PLAYWRIGHT_BASE_URL: "http://localhost:8080" }
      - if: always()
        run: docker compose --profile s3 --profile scanner -f docker-compose.yml -f docker-compose.integration.yml logs --no-color > compose.log
      - if: always()
        run: docker compose --profile s3 --profile scanner -f docker-compose.yml -f docker-compose.integration.yml down -v
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --require-hashes -r requirements.lock && pip install pip-audit
      - run: pip-audit -r requirements.lock
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@v2
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: "1" }
