name: Deployment preparation
on:
  workflow_dispatch:
    inputs:
      dry_run: { description: "Keep true until a staging environment is approved", required: true, default: true, type: boolean }
permissions: { contents: read, packages: write }
jobs:
  immutable-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with: { registry: "${{ vars.CONTAINER_REGISTRY }}", username: "${{ secrets.REGISTRY_USERNAME }}", password: "${{ secrets.REGISTRY_PASSWORD }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., push: "${{ !inputs.dry_run }}", tags: "${{ vars.CONTAINER_REGISTRY }}/studyease-api:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with: { context: frontend, push: "${{ !inputs.dry_run }}", tags: "${{ vars.CONTAINER_REGISTRY }}/studyease-frontend:${{ github.sha }}" }
      - run: echo "Deployment intentionally stops after immutable image preparation. Backup, migration, rollout, readiness, smoke, and rollback are provider-specific gated stages documented in docs/deployment.md."
